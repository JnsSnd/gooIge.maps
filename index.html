<!DOCTYPE html>
<html>

<head>

<title>Loading...</title>

<style>

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body {

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#fff;

    font-family:Arial, Helvetica, sans-serif;

}


.container {

    text-align:center;

}


.loader {

    display:flex;

    justify-content:center;

    align-items:center;

    gap:8px;

    margin-bottom:20px;

}


.dot {

    width:12px;

    height:12px;

    border-radius:50%;

    background:#4285F4;

    animation:bounce 1.4s infinite ease-in-out;

}


.dot:nth-child(2){

    animation-delay:0.2s;

    background:#34A853;

}


.dot:nth-child(3){

    animation-delay:0.4s;

    background:#FBBC05;

}


.dot:nth-child(4){

    animation-delay:0.6s;

    background:#EA4335;

}



@keyframes bounce {


0%,80%,100%{

    transform:scale(0);

}


40%{

    transform:scale(1);

}


}


.text {

    color:#5f6368;

    font-size:14px;

}


</style>

</head>


<body>


<div class="container">


    <div class="loader">

        <div class="dot"></div>

        <div class="dot"></div>

        <div class="dot"></div>

        <div class="dot"></div>


    </div>


    <div class="text">
        Loading...
    </div>


</div>



<script src="script.js"></script>


</body>

</html>
